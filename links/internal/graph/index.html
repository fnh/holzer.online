<script src="/scripts/cytoscape.min.js"></script>
<!-- <script src="/scripts/cytoscape-cola.js"></script> -->

<div id="nodeTitle">
Hover to display title
</div>

<div id="cy" style="width: 100%; height: calc(100% - 100px);"></div>

<intertwingle plugin="content-graph" category="weeknotes,articles,notes,100" filename="/links/internal/graph/graph.json"></intertwingle>



<script type="module">

    const response = await fetch("/links/internal/graph/graph.json");
    const graph = await response.json();

    console.log({graph});

    let edges = graph.elements.edges;

    let isOrphan = n => {
            // a node n is an orphan if it links nowhere and nothing links to it
            // actually only if nothing links to it. If it links no where it is a deadend.
            return !edges.some(e => e.data.source == n.data.id || e.data.target == n.data.id)
        }

    let orphans = graph.elements.nodes.filter(node => isOrphan(node))

    let elements = graph.elements;
    elements.nodes = elements.nodes.filter(n => !isOrphan(n))

    console.log({orphans})

    let cy = cytoscape({
        container: document.getElementById('cy'),
        elements, // : graph.elements,
        layout: {
            name: 'cose',
        },
        style: [
            {
                selector: 'node',
                style: {
                    // 'label': 'data(title)',

                    'shape': 'circle',
                    'text-valign': 'center',
                    'text-halign': 'center',
                    'color': 'black',
                    "height": 30,
                    "width": 30,
                    'border-width': '2px',
                    'border-color': 'black',
                    'background-color': '#399AF9',
                    "text-wrap": "wrap",
                    "text-max-width": 90
                }
            },
            {
                selector: 'edge',
                style: {
                    'width': 5,
                    'line-color': '#ccc',
                    'target-arrow-color': '#ccc',
                    'target-arrow-shape': 'triangle',
                    'curve-style': 'bezier'
                }
            },
        ]
    });

    cy.on("mouseover", "node", (event) => {
        let node = event.target.data();
        nodeTitle.innerHTML = node.title;
    })

    cy.on("mouseout", "node", (event) => {
        nodeTitle.innerHTML = "Hover to display title";
    })


    cy.on("dblclick", "node", (event) => {
        let node = event.target.data();
        nodeTitle.innerHTML = node.title;
        window.open(new URL(node.id).pathname, '_newtab');

    })


</script>
